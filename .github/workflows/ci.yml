name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Protobuf codegen is up to date
        run: |
          pnpm gen
          git diff --exit-code packages/runner-protocol/gen
      - name: buf lint
        working-directory: packages/runner-protocol
        run: pnpm exec buf lint
      - name: buf breaking
        if: github.event_name == 'pull_request'
        working-directory: packages/runner-protocol
        run: pnpm exec buf breaking --against "../../.git#ref=origin/${{ github.base_ref }},subdir=packages/runner-protocol"
      - run: pnpm --filter @sling/web build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: cargo build -p sling-runner -p sling-harness-codex -p sling-harness-claude-code
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sling/server test:e2e

  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p sling-runner
      - name: Runner binary stays under 15 MB
        run: |
          size=$(stat -c %s target/release/sling-runner)
          echo "sling-runner: $((size / 1024)) KiB"
          test "$size" -lt $((15 * 1024 * 1024))

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sandbox/Dockerfile
          tags: sling-sandbox:dev
          load: true
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,scope=sandbox,mode=max
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run a task in a real Docker sandbox
        working-directory: apps/server
        run: pnpm exec vitest run test/sandbox-docker.e2e.test.ts
