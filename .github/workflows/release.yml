name: Release

on:
  push:
    tags: ["v*"]
  # Builds the images again for a release whose Runner builds are already published.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build images for, like v0.0.1
        required: true

permissions:
  contents: write
  packages: write

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the Cargo version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sling-runner") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but Cargo.toml says $version. Servers hand out the build named after Cargo.toml's version, so bump it and tag v$version." >&2
            exit 1
          fi

  runner:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p sling-runner --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="sling-runner-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/sling-runner.exe" "dist/$name/"
            cp LICENSE NOTICE "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" > /dev/null)
            (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          else
            cp "target/${{ matrix.target }}/release/sling-runner" "dist/$name/"
            cp LICENSE NOTICE "dist/$name/"
            (cd dist && tar czf "$name.tar.gz" "$name")
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: runner-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    needs: runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            scripts/install.sh
            scripts/install.ps1

  image:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      # The Dockerfile comes from the ref the workflow runs on, so a build fix
      # on main reaches a tag that's already released. The source is the tag's.
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: src
      # A registry path must be lowercase, and the repository's owner may not be.
      - name: Image name
        id: image
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest

  sandbox-image:
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      # A registry path must be lowercase, and the repository's owner may not be.
      - name: Image name
        id: image
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}-sandbox:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}-sandbox:latest
