# Postgres for local development. Run from the repo root:
#   docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sling
      POSTGRES_PASSWORD: sling
      POSTGRES_DB: sling
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sling-dev-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sling"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  sling-dev-pg:
