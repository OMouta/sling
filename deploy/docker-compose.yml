# Self-hosted Sling. From this directory:
#   cp .env.example .env   # then fill it in
#   docker compose up -d
services:
  sling:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sling:local
    env_file: .env
    environment:
      DATABASE_URL: postgres://sling:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sling
    ports:
      - "${SLING_PORT:-8080}:8080"
    extra_hosts:
      # Lets the server reach Ollama or other services on the host machine.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sling
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sling
    volumes:
      - sling-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sling"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  sling-pg:
