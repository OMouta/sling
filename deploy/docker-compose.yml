# Self-hosted Sling. From this directory:
#   ./setup.sh             # asks how Sling should be reached, writes .env, starts it
# or by hand:
#   cp .env.example .env   # then fill it in
#   docker compose up -d
#
# Its own project name, so it never touches the development Postgres
# (project "deploy", from docker-compose.dev.yml).
name: sling

services:
  sling:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sling:local
    env_file: .env
    environment:
      DATABASE_URL: postgres://sling:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sling
    ports:
      # 127.0.0.1 keeps Sling to this computer and to a tunnel; 0.0.0.0 opens it to the local network.
      - "${SLING_BIND:-127.0.0.1}:${SLING_PORT:-8080}:8080"
    extra_hosts:
      # Lets the server reach Ollama or other services on the host machine.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sling
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sling
    volumes:
      - sling-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sling"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Serves Sling to your tailnet at https://<SLING_TAILSCALE_HOSTNAME>.<tailnet>.ts.net.
  # On with COMPOSE_PROFILES=tailscale; TS_AUTHKEY goes in tunnel.env.
  tailscale:
    image: tailscale/tailscale:v1.104.4
    profiles: [tailscale]
    hostname: ${SLING_TAILSCALE_HOSTNAME:-sling}
    env_file:
      - path: tunnel.env
        required: false
    environment:
      TS_HOSTNAME: ${SLING_TAILSCALE_HOSTNAME:-sling}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - sling-tailscale:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    restart: unless-stopped

  # Connects a Cloudflare Tunnel. Its public hostname, set in Cloudflare,
  # points at http://sling:8080. On with COMPOSE_PROFILES=cloudflare;
  # TUNNEL_TOKEN goes in tunnel.env.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [cloudflare]
    command: tunnel --no-autoupdate run
    env_file:
      - path: tunnel.env
        required: false
    restart: unless-stopped

volumes:
  sling-pg:
  sling-tailscale:
