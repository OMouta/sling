// Protocol between a Sling Runner and the control plane.
//
// Transport: the Runner opens a WebSocket to /runner/v1/ws. Every binary frame
// is exactly one Envelope. Text frames are not used.
//
// Handshake:
//   1. server -> Challenge
//   2. runner -> Hello (signed with the Runner's Ed25519 key, see Hello)
//   3. server -> Welcome, or Error then close
//
// Task traffic is a per-task stream of TaskEvents numbered from 1. The Runner
// keeps events on disk until the server acknowledges them with EventAck, and
// resends anything unacknowledged after a reconnect. The server ignores
// duplicates by (task_id, seq).

syntax = "proto3";

package sling.runner.v1;

enum PermissionMode {
  PERMISSION_MODE_UNSPECIFIED = 0;
  PERMISSION_MODE_READ_ONLY = 1;
  PERMISSION_MODE_SUPERVISED = 2;
  PERMISSION_MODE_AUTO = 3;
  PERMISSION_MODE_FULL_ACCESS = 4;
}

message Envelope {
  oneof body {
    // Runner to server.
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    Inventory inventory = 3;
    TaskEvent task_event = 4;

    // Server to Runner.
    Challenge challenge = 20;
    Welcome welcome = 21;
    HeartbeatAck heartbeat_ack = 22;
    TaskAssign task_assign = 23;
    TaskCancel task_cancel = 24;
    ActionRequest action_request = 25;
    EventAck event_ack = 26;
    Error error = 27;
  }
}

// ---------------------------------------------------------------- handshake

message Challenge {
  // 32 random bytes. Valid for this connection only.
  bytes nonce = 1;
}

// The Runner signs the UTF-8 bytes of:
//   "sling-runner-auth-v1\n" + hex(nonce) + "\n" + runner_id + "\n" + timestamp_ms
// with its Ed25519 private key. The server rejects timestamps more than 60
// seconds away from its own clock.
message Hello {
  string runner_id = 1;
  int64 timestamp_ms = 2;
  bytes signature = 3;
  string runner_version = 4;
  string os = 5;
  string arch = 6;
  string hostname = 7;
  Inventory inventory = 8;
  repeated HeldTask held_tasks = 9;
}

// A task the Runner still knows about when it connects.
message HeldTask {
  string task_id = 1;
  bool running = 2;
  // Highest event seq the Runner has written for this task.
  uint64 last_seq = 3;
}

message Welcome {
  int64 server_time_ms = 1;
  uint32 heartbeat_interval_seconds = 2;
  // Tasks the server has finished with. The Runner can drop their spools.
  repeated string forget_task_ids = 3;
}

message Heartbeat {
  uint32 running_tasks = 1;
}

message HeartbeatAck {}

message Error {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_BAD_SIGNATURE = 1;
    CODE_REVOKED = 2;
    CODE_UNKNOWN_RUNNER = 3;
    CODE_CLOCK_SKEW = 4;
    CODE_PROTOCOL = 5;
  }
  Code code = 1;
  string message = 2;
}

// ---------------------------------------------------------------- inventory

// What this machine offers. Sent inside Hello and again whenever it changes.
message Inventory {
  repeated Capability capabilities = 1;
  repeated Repo repos = 2;
  // Highest permission mode this Runner accepts. Set only in the Runner's
  // local config. The server cannot raise it.
  PermissionMode max_mode = 3;
  uint32 max_concurrent_tasks = 4;
  // Labels set in the Runner's local config, plus automatic "os:<os>" and
  // "arch:<arch>". Tasks can require labels. The server cannot change them.
  repeated string labels = 5;
}

message Capability {
  // "coding.codex" and "coding.claude-code" for coding agents, plus "git" and
  // "git.pr.github".
  string name = 1;
  string version = 2;
  // True when the capability can be used right now, for example Codex is
  // installed and logged in.
  bool ready = 3;
  string detail = 4;
}

message Repo {
  // Name chosen with `sling-runner repo add`. Unique per Runner.
  string name = 1;
  string default_branch = 2;
  string remote_url = 3;
  // Whether the harness may use the network in this repo. Set only on the
  // Runner.
  bool network = 4;
}

// ---------------------------------------------------------------- tasks

message TaskAssign {
  string task_id = 1;
  string repo = 2;
  string title = 3;
  string objective = 4;
  PermissionMode mode = 5;
  // Coding agent to run: "codex" or "claude-code".
  string harness = 6;
  // Branch to create, for example "sling/ab12cd-footer-year".
  string branch = 7;
}

message TaskCancel {
  string task_id = 1;
}

message EventAck {
  string task_id = 1;
  // Every event with seq <= this value has been stored.
  uint64 seq = 2;
}

message TaskEvent {
  string task_id = 1;
  uint64 seq = 2;
  int64 at_ms = 3;
  oneof kind {
    TaskAccepted accepted = 10;
    TaskRejected rejected = 11;
    TaskStarted started = 12;
    AgentMessage agent_message = 13;
    CommandRun command = 14;
    FileChange file_change = 15;
    PlanUpdate plan = 16;
    LogLine log = 17;
    Usage usage = 18;
    TaskFinished finished = 19;
    ActionResult action_result = 20;
  }
}

message TaskAccepted {}

message TaskRejected {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_MODE_ABOVE_CAP = 1;
    REASON_UNKNOWN_REPO = 2;
    REASON_HARNESS_UNAVAILABLE = 3;
    REASON_BUSY = 4;
    REASON_INVALID = 5;
  }
  Reason reason = 1;
  string message = 2;
}

message TaskStarted {
  string branch = 1;
  string base_sha = 2;
  string worktree_path = 3;
  string harness = 4;
  string harness_version = 5;
}

message AgentMessage {
  string item_id = 1;
  string text = 2;
}

message CommandRun {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_STARTED = 1;
    STATUS_COMPLETED = 2;
    STATUS_FAILED = 3;
  }
  string item_id = 1;
  string command = 2;
  Status status = 3;
  optional int32 exit_code = 4;
  // Truncated by the Runner.
  string output = 5;
}

message FileChange {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_ADD = 1;
    KIND_MODIFY = 2;
    KIND_DELETE = 3;
  }
  message Change {
    string path = 1;
    Kind kind = 2;
  }
  string item_id = 1;
  repeated Change changes = 2;
}

message PlanUpdate {
  message Step {
    string text = 1;
    bool done = 2;
  }
  repeated Step steps = 1;
}

message LogLine {
  enum Stream {
    STREAM_UNSPECIFIED = 0;
    STREAM_RUNNER = 1;
    STREAM_HARNESS_STDERR = 2;
  }
  Stream stream = 1;
  string text = 2;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 cached_input_tokens = 2;
  uint64 output_tokens = 3;
}

message DiffStats {
  uint32 files_changed = 1;
  uint32 insertions = 2;
  uint32 deletions = 3;
}

message TaskFinished {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_SUCCEEDED = 1;
    OUTCOME_FAILED = 2;
    OUTCOME_CANCELLED = 3;
    OUTCOME_INTERRUPTED = 4;
  }
  Outcome outcome = 1;
  string summary = 2;
  string error = 3;
  string branch = 4;
  // Empty when the task made no changes.
  string commit_sha = 5;
  DiffStats diff_stats = 6;
}

// ---------------------------------------------------------------- actions

message ActionRequest {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PUSH = 1;
    KIND_OPEN_PR = 2;
  }
  string action_id = 1;
  string task_id = 2;
  Kind kind = 3;
  string pr_title = 4;
  string pr_body = 5;
}

message ActionResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_SUCCEEDED = 1;
    OUTCOME_FAILED = 2;
    // The Runner's own policy refused it, for example a push to the default
    // branch outside Full access.
    OUTCOME_REFUSED = 3;
  }
  string action_id = 1;
  ActionRequest.Kind kind = 2;
  Outcome outcome = 3;
  string message = 4;
  // PR URL, or a compare URL when no PR could be opened.
  string url = 5;
}
