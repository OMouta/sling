[package]
name = "sling-harness-codex"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Runs Codex (`codex exec --json`) and maps its events to Sling task events"

[[bin]]
name = "fake-codex"
path = "src/bin/fake-codex.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sling-runner-protocol = { path = "../runner-protocol" }
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
