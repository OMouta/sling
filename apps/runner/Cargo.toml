[package]
name = "sling-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Sling Runner: runs delegated tasks on your own machine"

[[bin]]
name = "sling-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ed25519-dalek = "3.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.34"
prost = "0.14.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sling-harness-claude-code = { path = "../../crates/harness-claude-code" }
sling-harness-codex = { version = "0.1.0", path = "../../crates/harness-codex" }
sling-runner-protocol = { path = "../../crates/runner-protocol" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "signal", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
