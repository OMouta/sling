<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfb" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sling" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      let theme = "dark";
      try {
        theme = localStorage.getItem("sling.theme") || "dark";
        if (theme === "system") {
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
      } catch {}
      document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      // The browser's bars follow the theme Sling shows, not only the system's.
      for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
        meta.content = theme === "light" ? "#fbfbfb" : "#161616";
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sling</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
